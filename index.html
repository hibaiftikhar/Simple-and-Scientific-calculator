<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scientific Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator">
    <h1>Scientific Calculator</h1>
    <input id="display" class="display" type="text" inputmode="decimal" autocomplete="off" aria-label="Calculator display" placeholder="0">
    <p id="message" class="message" aria-live="polite">Choose a button to begin.</p>

    <section class="keys" aria-label="Calculator buttons">
      <button data-action="clear" class="utility">AC</button>
      <button data-action="delete" class="utility">DEL</button>
      <button data-value="(">(</button>
      <button data-value=")">)</button>
      <button data-value="/">÷</button>

      <button data-value="sin(">sin</button>
      <button data-value="cos(">cos</button>
      <button data-value="tan(">tan</button>
      <button data-value="sqrt(">√</button>
      <button data-value="^">xʸ</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button data-value="*">×</button>
      <button data-value="pi">π</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button data-value="-">−</button>
      <button data-value="e">e</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button data-value="+">+</button>
      <button data-value="%">%</button>

      <button data-value="0">0</button>
      <button data-value=".">.</button>
      <button data-value="log(">log</button>
      <button data-value="ln(">ln</button>
      <button data-action="equals" class="equals">=</button>
    </section>
    <p class="note">Trigonometric functions use degrees. Use parentheses for function inputs, e.g. sin(30).</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
